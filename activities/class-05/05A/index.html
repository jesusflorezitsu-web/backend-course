<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitudes · 05A — app sobre la API real</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <strong class="brand">Solicitudes<small>· 05A</small></strong>
    <div class="session-box">
      <span id="session-user" class="session-user">Sin sesión</span>
      <button id="logout-btn" hidden type="button">Salir</button>
    </div>
  </header>

  <main id="app" class="layout" aria-live="polite">
    <!-- auth panel (mounts the login/register forms) -->
    <section id="auth-panel" class="panel panel--auth" hidden></section>

    <!-- workspace: list + detail -->
    <div id="workspace" hidden>
      <aside class="panel">
        <h2>Listado</h2>
        <form id="filters" class="flow">
          <div class="row">
            <label>Estado
              <select name="status">
                <option value="">todos</option>
                <option value="open">open</option>
                <option value="in_progress">in_progress</option>
                <option value="resolved">resolved</option>
                <option value="closed">closed</option>
                <option value="cancelled">cancelled</option>
              </select>
            </label>
            <label>Prioridad
              <select name="priority">
                <option value="">todas</option>
                <option value="low">low</option>
                <option value="medium">medium</option>
                <option value="high">high</option>
              </select>
            </label>
            <button type="submit">Filtrar</button>
          </div>
        </form>
        <p id="list-state" class="feedback" role="status"></p>
        <ul id="request-list" class="request-list"></ul>
      </aside>

      <section class="panel">
        <h2 id="detail-title">Detalle</h2>
        <div id="detail" class="detail"></div>
      </section>
    </div>
  </main>

  <dialog id="create-dialog">
    <form id="create-form" class="flow" method="dialog">
      <h3>Nueva solicitud</h3>
      <label>Titulo <input name="title" required maxlength="120"></label>
      <label>Descripcion <textarea name="description" rows="3"></textarea></label>
      <label>Prioridad
        <select name="priority">
          <option value="low">low</option>
          <option value="medium" selected>medium</option>
          <option value="high">high</option>
        </select>
      </label>
      <p id="create-feedback" class="feedback" role="status"></p>
      <div class="row">
        <button type="submit">Crear</button>
        <button type="button" id="create-cancel">Cancelar</button>
      </div>
    </form>
  </dialog>

  <template id="tpl-auth">
    <div class="tabs" role="tablist" aria-label="Acceso">
      <button data-tab="login" type="button" role="tab" aria-selected="true">Entrar</button>
      <button data-tab="register" type="button" role="tab" aria-selected="false">Crear cuenta</button>
    </div>

    <form id="login-form" class="flow" data-kind="login">
      <label>Email <input name="email" type="email" required autocomplete="username"></label>
      <label>Password <input name="password" type="password" required minlength="15" maxlength="128" autocomplete="current-password"></label>
      <p class="hint">15–128 caracteres. ¡Sí, tal como lo exige la API!</p>
      <button type="submit">Iniciar sesión</button>
    </form>

    <form id="register-form" class="flow" data-kind="register" hidden>
      <label>Email <input name="email" type="email" required autocomplete="username"></label>
      <label>Password <input name="password" type="password" required minlength="15" maxlength="128" autocomplete="new-password"></label>
      <label>Repetir password <input name="password2" type="password" required minlength="15" maxlength="128" autocomplete="new-password"></label>
      <p class="hint">El rol lo define el servidor (siempre <code>requester</code>): el body nunca lo lleva.</p>
      <button type="submit" id="register-submit">Crear cuenta y entrar</button>
    </form>

    <p id="auth-feedback" class="feedback" role="status"></p>
  </template>

  <template id="tpl-request-item">
    <li class="request-item" data-id="">
      <button type="button" class="request-item__open">Ver</button>
      <div class="request-item__body">
        <span class="request-item__title"></span>
        <span class="request-item__meta"></span>
      </div>
    </li>
  </template>

  <script type="module" src="./main.js"></script>
</body>
</html>
